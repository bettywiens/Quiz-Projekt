<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Fachinformatiker Quiz</title>
</head>
<body>
    <main>
        <!--<h1>Welcher Fachinformatiker-Typ bist du?</h1>-->
        
        <div id="logo">
            <img src="bilder/logo.svg">
        </div>

        <div id="quiz">

            <h2 id="frage"></h2>

            <div class="quiz-inhalt">

                <div class="bild">
                    <!-- später kommt hier ein Bild hin -->
                </div>

                <div id="antworten">
                    <!-- Hier werden später die Antwort-Buttons eingefügt -->
                </div>

            </div>

            <div class="navigation">
                <button id="zurueck">Zurück</button>
                <button id="weiter">Weiter</button>
            </div>
        </div>


        <div id="ergebnis">
            <!-- Hier erscheint später das Ergebnsi -->
        </div>
    </main>

    <script src="fragen/fachrichtung.js"></script>
    <script src="script.js"></script>
</body>
</html>
